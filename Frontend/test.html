<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }
        .status {
            font-size: 1.5rem;
            margin: 10px 0;
        }
        .success {
            color: #4ade80;
        }
        button {
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 1.2rem;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚦 Smart Traffic System</h1>
        <div class="status">Frontend Server: <span class="success">✓ Running</span></div>
        <div class="status">Backend Server: <span id="backend-status">Checking...</span></div>
        <button onclick="window.location.href='/'">Go to Main App</button>
    </div>

    <script>
        // Test backend connection
        fetch('http://localhost:8000/docs')
            .then(response => {
                document.getElementById('backend-status').innerHTML = '<span class="success">✓ Running</span>';
            })
            .catch(error => {
                document.getElementById('backend-status').innerHTML = '<span style="color: #f87171">✗ Error</span>';
            });
    </script>
</body>
</html>
